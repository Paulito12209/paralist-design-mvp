<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paralist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="sprites" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-placeholder" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="5" width="17" height="14" rx="3" stroke="currentColor" stroke-width="1.6" />
        <circle cx="9" cy="10" r="1.6" fill="currentColor" />
        <path d="M6.5 16.5 10 13l3 2.5 2.2-1.8 2.3 2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <!-- svg/symbol: Inbox-Tray mit Pfeil nach unten; ohne Grafik-Tag gäbe es kein Bild für die Inbox-Karte -->
      <symbol id="icon-inbox" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 3.4v8.6M8.7 8.6 12 12l3.3-3.4"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M4 13.6h4.1l1.2 1.9h5.4l1.2-1.9H20v4.3A2.2 2.2 0 0 1 17.8 20.1H6.2A2.2 2.2 0 0 1 4 17.9v-4.3Z"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="6.25" stroke="currentColor" stroke-width="1.8" />
        <path d="M16 16.5 20 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24" fill="none">
        <path d="M4 7h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="9" cy="7" r="2.2" fill="currentColor" />
        <circle cx="15" cy="17" r="2.2" fill="currentColor" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-circle" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="7.25" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24" fill="none">
        <path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24" fill="none">
        <path d="M3.5 8.5V18a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-7.2L9.5 6H5.5a2 2 0 0 0-2 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <!-- svg/symbol: nötig für Icons; ohne Grafik-Tags gäbe es keine Bilder für Ordner, Plus usw. -->
      <symbol id="icon-folder-plus" viewBox="0 0 24 24" fill="none">
        <path
          d="M20.4 12.7V10.7A1.9 1.9 0 0 0 18.5 8.8H11.3L9.3 6.5H5.5A1.9 1.9 0 0 0 3.6 8.4V17.1A1.9 1.9 0 0 0 5.5 19H11.6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M17.6 15.4V21.4M14.6 18.4H20.6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-profile" viewBox="0 0 24 24" fill="none">
        <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none">
        <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-back" viewBox="0 0 24 24" fill="none">
        <path d="m15 5-8 7 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-task" viewBox="0 0 24 24" fill="none">
        <rect x="4.5" y="3.5" width="15" height="17" rx="3" stroke="currentColor" stroke-width="1.6" />
        <path d="m8 12 2.4 2.4L16.5 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-note" viewBox="0 0 24 24" fill="none">
        <path d="M7 3.5h7.2L19.5 9v11.5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-15a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M14 3.5V9h5.5M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 3.5v4M16 3.5v4M3.5 10h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <rect x="7.2" y="13.2" width="3" height="3" rx="0.6" fill="currentColor" />
        <rect x="13.8" y="13.2" width="3" height="3" rx="0.6" fill="currentColor" />
      </symbol>
      <symbol id="icon-person" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6" />
        <path d="M5.5 19.2c.8-3.4 3.3-5.2 6.5-5.2s5.7 1.8 6.5 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-wave" viewBox="0 0 24 24" fill="none">
        <path d="M4 12h2.2M8.5 7.5v9M12.2 4.5v15M15.8 8v8M19.5 11v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6" />
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6" />
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6" />
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="icon-photos" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="6.5" width="13.5" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6" />
        <path d="M7.5 6.2V5.8A2.3 2.3 0 0 1 9.8 3.5h8.9A2.3 2.3 0 0 1 21 5.8v8.9a2.3 2.3 0 0 1-2.3 2.3h-.4" stroke="currentColor" stroke-width="1.6" />
        <circle cx="8.2" cy="11.2" r="1.3" fill="currentColor" />
        <path d="m6.2 17.2 3.2-3.2 2.2 2.1 1.6-1.4 2.4 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24" fill="none">
        <path
          d="M9.6 3.9c.1-.5.56-.9 1.11-.9h2.58c.55 0 1.02.4 1.11.9l.21 1.28c.07.37.32.69.65.87l.22.13c.32.2.72.26 1.07.12l1.22-.45a1.13 1.13 0 0 1 1.37.49l1.3 2.25c.27.48.16 1.08-.26 1.43l-1 .83c-.3.24-.44.61-.43.99v.25c0 .38.14.75.43.99l1 .83c.42.35.53.95.26 1.43l-1.3 2.25a1.13 1.13 0 0 1-1.37.49l-1.22-.46c-.35-.13-.75-.07-1.07.13l-.22.13c-.33.18-.58.49-.65.87l-.21 1.28c-.09.54-.56.94-1.11.94h-2.58c-.55 0-1.02-.4-1.11-.94l-.21-1.28c-.07-.38-.32-.69-.65-.87l-.22-.13c-.32-.2-.72-.26-1.07-.12l-1.22.45a1.13 1.13 0 0 1-1.37-.49l-1.3-2.25a1.13 1.13 0 0 1 .26-1.43l1-.83c.29-.24.44-.61.43-.99v-.25c0-.38-.14-.75-.43-.99l-1-.83a1.13 1.13 0 0 1-.26-1.43l1.3-2.25a1.13 1.13 0 0 1 1.37-.49l1.22.46c.35.13.75.07 1.07-.13l.22-.13c.33-.18.58-.49.65-.87L9.6 3.9Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 8v4.2l3 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <!-- Verknüpfen: zwei Knoten oben, einer unten, der rechte Ast läuft weich in den Stamm -->
      <symbol id="icon-link" viewBox="0 0 24 24" fill="none">
        <circle cx="7" cy="6.3" r="2.6" stroke="currentColor" stroke-width="1.9" />
        <circle cx="17" cy="6.3" r="2.6" stroke="currentColor" stroke-width="1.9" />
        <circle cx="7" cy="17.7" r="2.6" stroke="currentColor" stroke-width="1.9" />
        <path d="M7 8.9V15.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
        <path
          d="M17 8.9V11.2A3.5 3.5 0 0 1 13.5 14.7H7"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-archive" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="4.5" width="17" height="4.5" rx="1.6" stroke="currentColor" stroke-width="1.7" />
        <path d="M5.2 9v8.9a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2V9" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M10 13h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none">
        <path d="M4.5 6.6h15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path d="M9.4 6.6V5.2a1.7 1.7 0 0 1 1.7-1.7h1.8a1.7 1.7 0 0 1 1.7 1.7v1.4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M6.6 6.6 7.5 19a1.9 1.9 0 0 0 1.9 1.8h5.2a1.9 1.9 0 0 0 1.9-1.8l.9-12.4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        <path d="M10.4 10.2v6.6M13.6 10.2v6.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-dots" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="5.2" r="1.7" fill="currentColor" />
        <circle cx="12" cy="12" r="1.7" fill="currentColor" />
        <circle cx="12" cy="18.8" r="1.7" fill="currentColor" />
      </symbol>
    </svg>

    <div class="stage">
      <div class="device">
        <header class="top-bar">
          <button class="icon-btn" type="button" aria-label="Menü 1">
            <svg class="icon"><use href="#icon-sliders"></use></svg>
          </button>
          <label class="search" id="search-entry">
            <svg class="icon search-icon"><use href="#icon-search"></use></svg>
            <input id="search-input" type="search" placeholder="Suchen" />
          </label>
          <button class="avatar" type="button" aria-label="Menü 2">
            <svg class="icon"><use href="#icon-profile"></use></svg>
          </button>
        </header>

        <main class="content">
          <section class="view is-active" id="view-home" data-view="home">
            <h1 class="screen-title">Übersicht</h1>

            <div class="overview-grid" id="overview-grid"></div>

            <div class="section-head">
              <h2>Arbeitsbereiche</h2>
            </div>

            <!-- Tabs links, Plus-Button rechts; bei vielen Tabs laufen die Pillen unter Linie und Button durch -->
            <div class="tab-pills-row">
              <div class="tab-pills" id="workspace-tabs"></div>
              <div class="tab-pills-tools">
                <div class="tab-pills-fade"></div>
                <div class="tab-pills-end">
                  <div class="tab-pills-split"></div>
                  <button class="add-btn" type="button" data-action="add-workspace" aria-label="Hinzufügen" onclick="addWorkspace()">
                    <svg class="icon"><use href="#icon-folder-plus"></use></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="workspace-list" id="workspace-list"></div>
          </section>

          <section class="view" id="view-page" data-view="page" hidden>
            <div class="page-head">
              <button class="back-btn" id="back-btn" type="button" aria-label="Zurück">
                <svg class="icon"><use href="#icon-back"></use></svg>
              </button>
              <h1 class="screen-title page-title" id="page-title">Platzhalter</h1>
              <button class="head-btn" id="page-menu" type="button" aria-label="Seitenmenü">
                <svg class="icon"><use href="#icon-dots"></use></svg>
              </button>
            </div>
            <div class="page-body" id="page-body"></div>
          </section>

          <!-- Editor-Seite: oeffnet sich beim Antippen eines Eintrags -->
          <section class="view" id="view-entry" data-view="entry" hidden>
            <div class="page-head">
              <button class="back-btn" id="entry-back" type="button" aria-label="Zurück">
                <svg class="icon"><use href="#icon-back"></use></svg>
              </button>
              <span class="entry-crumb" id="entry-crumb"></span>
              <button class="head-btn" id="entry-menu" type="button" aria-label="Seitenmenü">
                <svg class="icon"><use href="#icon-dots"></use></svg>
              </button>
            </div>
            <!-- input/textarea: noetig, damit Titel und Text wirklich bearbeitbar sind -->
            <input class="entry-title" id="entry-title" type="text" placeholder="Ohne Titel" aria-label="Titel" />
            <textarea class="entry-body" id="entry-body" placeholder="Schreib etwas …" aria-label="Inhalt"></textarea>
          </section>

          <section class="view" id="view-search" data-view="search" hidden>
            <h1 class="screen-title">Suchen</h1>

            <button class="workspace-row" type="button">
              <svg class="icon"><use href="#icon-clock"></use></svg>
              <span>Zuletzt gesucht</span>
              <svg class="icon chevron"><use href="#icon-chevron"></use></svg>
            </button>

            <div class="section-head">
              <h2>Am häufigsten geöffnet</h2>
            </div>
            <div class="workspace-list">
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-task"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Startseite: Layout optimieren</p>
                  <p class="search-meta">Aufgabe · 78× geöffnet</p>
                </div>
              </button>
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-circle"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Paralist iOS App</p>
                  <p class="search-meta">Projekt · 41× geöffnet</p>
                </div>
              </button>
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-circle"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Prüfung Statistik</p>
                  <p class="search-meta">Projekt · 8× geöffnet</p>
                </div>
              </button>
            </div>

            <div class="section-head">
              <h2>Zuletzt geöffnet</h2>
            </div>
            <h3 class="date-label">Heute</h3>
            <div class="workspace-list">
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-calendar"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Mama Geburtstag</p>
                  <p class="search-meta">Termin · 20:05</p>
                </div>
                <svg class="icon chevron"><use href="#icon-chevron"></use></svg>
              </button>
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-task"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Startseite: Layout optimieren</p>
                  <p class="search-meta">Aufgabe · 18:10</p>
                </div>
                <svg class="icon chevron"><use href="#icon-chevron"></use></svg>
              </button>
            </div>
          </section>

          <section class="view" id="view-calendar" data-view="calendar" hidden>
            <h1 class="screen-title">Kalender</h1>
            <p class="empty-note">Noch keine Termine.</p>
          </section>

          <section class="view" id="view-media" data-view="media" hidden>
            <h1 class="screen-title">Medien</h1>
            <p class="empty-note">Noch keine Medien.</p>
          </section>

          <section class="view" id="view-settings" data-view="settings" hidden>
            <h1 class="screen-title">Einstellungen</h1>
            <p class="empty-note">Platzhalter für Einstellungen.</p>
          </section>
        </main>

        <footer class="bottom-bar">
          <!-- nav-shell: derselbe runde Container fuer Navigation und Composer -->
          <div class="nav-shell" id="nav-shell">
          <!-- nav: untere App-Leiste mit den Hauptseiten -->
          <nav class="tab-bar" id="tab-bar" aria-label="Hauptnavigation">
            <button class="tab-btn is-active" type="button" data-tab="home" aria-current="page">
              <svg class="icon"><use href="#icon-grid"></use></svg>
              <span>Übersicht</span>
            </button>
            <button class="tab-btn" type="button" data-tab="calendar">
              <svg class="icon"><use href="#icon-calendar"></use></svg>
              <span>Kalender</span>
            </button>
            <button class="tab-add" type="button" aria-label="Hinzufügen">
              <svg class="icon"><use href="#icon-plus"></use></svg>
            </button>
            <button class="tab-btn" type="button" data-tab="media">
              <svg class="icon"><use href="#icon-photos"></use></svg>
              <span>Medien</span>
            </button>
            <button class="tab-btn" type="button" data-tab="settings">
              <svg class="icon"><use href="#icon-settings"></use></svg>
              <span>Einstellungen</span>
            </button>
          </nav>

          <!-- composer: ersetzt die Navigation im selben Container beim Anlegen -->
          <div class="composer" id="composer" hidden>
            <button class="composer-link" type="button" id="composer-link">
              <svg class="icon"><use href="#icon-link"></use></svg>
              <span id="composer-link-label">Inbox</span>
              <svg class="icon composer-caret"><use href="#icon-chevron"></use></svg>
            </button>
            <input
              class="composer-input"
              id="composer-input"
              type="text"
              placeholder="Notiz, Aufgabe, Termin …"
              aria-label="Neuer Eintrag"
              autocomplete="off"
            />
            <div class="composer-tools">
              <div class="composer-types" id="composer-types"></div>
              <button class="composer-close" type="button" id="composer-close" aria-label="Schließen">
                <svg class="icon"><use href="#icon-close"></use></svg>
              </button>
            </div>
          </div>
          </div>
        </footer>

        <!-- sheet: gemeinsames Auswahl-Blatt fuer Verknuepfen und Seitenmenue -->
        <div class="sheet-backdrop" id="sheet" hidden>
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <h2 class="sheet-title" id="sheet-title"></h2>
            <div class="sheet-options" id="sheet-options"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
