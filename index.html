<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paralist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="sprites" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-placeholder" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="5" width="17" height="14" rx="3" stroke="currentColor" stroke-width="1.6" />
        <circle cx="9" cy="10" r="1.6" fill="currentColor" />
        <path d="M6.5 16.5 10 13l3 2.5 2.2-1.8 2.3 2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="6.25" stroke="currentColor" stroke-width="1.8" />
        <path d="M16 16.5 20 20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24" fill="none">
        <path d="M4 7h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="9" cy="7" r="2.2" fill="currentColor" />
        <circle cx="15" cy="17" r="2.2" fill="currentColor" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-circle" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="7.25" stroke="currentColor" stroke-width="1.6" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24" fill="none">
        <path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24" fill="none">
        <path d="M3.5 8.5V18a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-7.2L9.5 6H5.5a2 2 0 0 0-2 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <!-- svg/symbol: nötig für Icons; ohne Grafik-Tags gäbe es keine Bilder für Ordner, Plus usw. -->
      <symbol id="icon-folder-plus" viewBox="0 0 24 24" fill="none">
        <path
          d="M20.4 12.7V10.7A1.9 1.9 0 0 0 18.5 8.8H11.3L9.3 6.5H5.5A1.9 1.9 0 0 0 3.6 8.4V17.1A1.9 1.9 0 0 0 5.5 19H11.6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M17.6 15.4V21.4M14.6 18.4H20.6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-profile" viewBox="0 0 24 24" fill="none">
        <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24" fill="none">
        <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-back" viewBox="0 0 24 24" fill="none">
        <path d="m15 5-8 7 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-task" viewBox="0 0 24 24" fill="none">
        <rect x="4.5" y="3.5" width="15" height="17" rx="3" stroke="currentColor" stroke-width="1.6" />
        <path d="m8 12 2.4 2.4L16.5 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-note" viewBox="0 0 24 24" fill="none">
        <path d="M7 3.5h7.2L19.5 9v11.5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-15a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M14 3.5V9h5.5M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="5" width="17" height="15.5" rx="3" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 3.5v4M16 3.5v4M3.5 10h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <rect x="7.2" y="13.2" width="3" height="3" rx="0.6" fill="currentColor" />
        <rect x="13.8" y="13.2" width="3" height="3" rx="0.6" fill="currentColor" />
      </symbol>
      <symbol id="icon-person" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6" />
        <path d="M5.5 19.2c.8-3.4 3.3-5.2 6.5-5.2s5.7 1.8 6.5 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-wave" viewBox="0 0 24 24" fill="none">
        <path d="M4 12h2.2M8.5 7.5v9M12.2 4.5v15M15.8 8v8M19.5 11v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
    </svg>

    <div class="stage">
      <div class="device">
        <header class="top-bar">
          <button class="icon-btn" type="button" aria-label="Menü 1">
            <svg class="icon"><use href="#icon-sliders"></use></svg>
          </button>
          <label class="search">
            <svg class="icon search-icon"><use href="#icon-search"></use></svg>
            <input type="search" placeholder="Platzhalter" />
          </label>
          <button class="avatar" type="button" aria-label="Menü 2">
            <svg class="icon"><use href="#icon-profile"></use></svg>
          </button>
        </header>

        <main class="content">
          <section class="view is-active" id="view-home" data-view="home">
            <h1 class="screen-title">Übersicht</h1>

            <div class="overview-grid" id="overview-grid"></div>

            <div class="section-head">
              <h2>Arbeitsbereiche</h2>
              <button class="add-btn" type="button" data-action="add-workspace" aria-label="Hinzufügen" onclick="addWorkspace()">
                <svg class="icon"><use href="#icon-folder-plus"></use></svg>
              </button>
            </div>

            <div class="workspace-list" id="workspace-list"></div>
          </section>

          <section class="view" id="view-page" data-view="page" hidden>
            <div class="page-head">
              <button class="back-btn" id="back-btn" type="button" aria-label="Zurück">
                <svg class="icon"><use href="#icon-back"></use></svg>
              </button>
              <h1 class="screen-title page-title" id="page-title">Platzhalter</h1>
            </div>
            <div class="page-body" id="page-body"></div>
          </section>
        </main>

        <footer class="bottom-bar">
          <div class="composer" id="composer">
            <!-- input: nötig, damit man im unteren Feld wirklich schreiben kann -->
            <input
              class="composer-input"
              id="composer-input"
              type="text"
              placeholder="Was steht heute an?"
              aria-label="Was steht heute an?"
              autocomplete="off"
            />
            <div class="toolbar">
              <button class="media-btn" type="button" aria-label="Medien hinzufügen">
                <svg class="icon"><use href="#icon-plus"></use></svg>
              </button>
              <div class="type-scroll" id="type-scroll">
                <button class="type-btn is-active" type="button" data-type="aufgaben" aria-label="Aufgaben" aria-pressed="true">
                  <svg class="icon"><use href="#icon-task"></use></svg>
                </button>
                <button class="type-btn" type="button" data-type="notizen" aria-label="Notizen" aria-pressed="false">
                  <svg class="icon"><use href="#icon-note"></use></svg>
                </button>
                <button class="type-btn" type="button" data-type="termine" aria-label="Termine" aria-pressed="false">
                  <svg class="icon"><use href="#icon-calendar"></use></svg>
                </button>
                <button class="type-btn" type="button" data-type="projekte" aria-label="Projekte" aria-pressed="false">
                  <svg class="icon"><use href="#icon-circle"></use></svg>
                </button>
                <button class="type-btn" type="button" data-type="person" aria-label="Person" aria-pressed="false">
                  <svg class="icon"><use href="#icon-person"></use></svg>
                </button>
              </div>
              <div class="toolbar-end">
                <div class="toolbar-fade"></div>
                <button class="close-btn" type="button" aria-label="Schließen">
                  <svg class="icon"><use href="#icon-close"></use></svg>
                </button>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
