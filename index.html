    <div class="stage">
      <div class="device">
        <header class="top-bar">
          <button class="icon-btn" type="button" aria-label="Menü 1">
            <svg class="icon"><use href="#icon-sliders"></use></svg>
          </button>
          <label class="search" id="search-entry">
            <svg class="icon search-icon"><use href="#icon-search"></use></svg>
            <input id="search-input" type="search" placeholder="Suchen" />
          </label>
          <button class="avatar" type="button" aria-label="Menü 2">
            <svg class="icon"><use href="#icon-profile"></use></svg>
          </button>
        </header>

        <main class="content">
          <section class="view is-active" id="view-home" data-view="home">
            <h1 class="screen-title">Übersicht</h1>

            <div class="overview-grid" id="overview-grid"></div>

            <div class="section-head">
              <h2>Arbeitsbereiche</h2>
            </div>

            <!-- Tabs links, Plus-Button rechts; bei vielen Tabs laufen die Pillen unter Linie und Button durch -->
            <div class="tab-pills-row">
              <div class="tab-pills" id="workspace-tabs"></div>
              <div class="tab-pills-tools">
                <div class="tab-pills-fade"></div>
                <div class="tab-pills-end">
                  <div class="tab-pills-split"></div>
                  <button class="add-btn" type="button" data-action="add-workspace" aria-label="Hinzufügen" onclick="addWorkspace()">
                    <svg class="icon"><use href="#icon-folder-plus"></use></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="workspace-list" id="workspace-list"></div>
          </section>

          <section class="view" id="view-page" data-view="page" hidden>
            <div class="page-head">
              <button class="back-btn" id="back-btn" type="button" aria-label="Zurück">
                <svg class="icon"><use href="#icon-back"></use></svg>
              </button>
              <h1 class="screen-title page-title" id="page-title">Platzhalter</h1>
              <button class="head-btn" id="page-menu" type="button" aria-label="Seitenmenü">
                <svg class="icon"><use href="#icon-dots"></use></svg>
              </button>
            </div>
            <div class="page-body" id="page-body"></div>
          </section>

          <!-- Editor-Seite: oeffnet sich beim Antippen eines Eintrags -->
          <section class="view" id="view-entry" data-view="entry" hidden>
            <div class="page-head">
              <button class="back-btn" id="entry-back" type="button" aria-label="Zurück">
                <svg class="icon"><use href="#icon-back"></use></svg>
              </button>
              <span class="entry-crumb" id="entry-crumb"></span>
              <button class="head-btn" id="entry-menu" type="button" aria-label="Seitenmenü">
                <svg class="icon"><use href="#icon-dots"></use></svg>
              </button>
            </div>
            <!-- input/textarea: noetig, damit Titel und Text wirklich bearbeitbar sind -->
            <input class="entry-title" id="entry-title" type="text" placeholder="Ohne Titel" aria-label="Titel" />
            <textarea class="entry-body" id="entry-body" placeholder="Schreib etwas …" aria-label="Inhalt"></textarea>
          </section>

          <section class="view" id="view-search" data-view="search" hidden>
            <h1 class="screen-title">Suchen</h1>

            <button class="workspace-row" type="button">
              <svg class="icon"><use href="#icon-clock"></use></svg>
              <span>Zuletzt gesucht</span>
              <svg class="icon chevron"><use href="#icon-chevron"></use></svg>
            </button>

            <div class="section-head">
              <h2>Am häufigsten geöffnet</h2>
            </div>
            <div class="workspace-list">
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-task"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Startseite: Layout optimieren</p>
                  <p class="search-meta">Aufgabe · 78× geöffnet</p>
                </div>
              </button>
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-circle"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Paralist iOS App</p>
                  <p class="search-meta">Projekt · 41× geöffnet</p>
                </div>
              </button>
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-circle"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Prüfung Statistik</p>
                  <p class="search-meta">Projekt · 8× geöffnet</p>
                </div>
              </button>
            </div>

            <div class="section-head">
              <h2>Zuletzt geöffnet</h2>
            </div>
            <h3 class="date-label">Heute</h3>
            <div class="workspace-list">
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-calendar"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Mama Geburtstag</p>
                  <p class="search-meta">Termin · 20:05</p>
                </div>
                <svg class="icon chevron"><use href="#icon-chevron"></use></svg>
              </button>
              <button class="search-row" type="button">
                <svg class="icon"><use href="#icon-task"></use></svg>
                <div class="search-copy">
                  <p class="search-title">Startseite: Layout optimieren</p>
                  <p class="search-meta">Aufgabe · 18:10</p>
                </div>
                <svg class="icon chevron"><use href="#icon-chevron"></use></svg>
              </button>
            </div>
          </section>

          <section class="view" id="view-calendar" data-view="calendar" hidden>
            <h1 class="screen-title">Kalender</h1>
            <p class="empty-note">Noch keine Termine.</p>
          </section>

          <section class="view" id="view-media" data-view="media" hidden>
            <h1 class="screen-title">Medien</h1>
            <p class="empty-note">Noch keine Medien.</p>
          </section>

          <section class="view" id="view-settings" data-view="settings" hidden>
            <h1 class="screen-title">Einstellungen</h1>
            <p class="empty-note">Platzhalter für Einstellungen.</p>
          </section>
        </main>

        <footer class="bottom-bar">
          <!-- nav-shell: derselbe runde Container fuer Navigation und Composer -->
          <div class="nav-shell" id="nav-shell">
          <!-- nav: untere App-Leiste mit den Hauptseiten -->
          <nav class="tab-bar" id="tab-bar" aria-label="Hauptnavigation">
            <button class="tab-btn is-active" type="button" data-tab="home" aria-current="page">
              <svg class="icon"><use href="#icon-grid"></use></svg>
              <span>Übersicht</span>
            </button>
            <button class="tab-btn" type="button" data-tab="calendar">
              <svg class="icon"><use href="#icon-calendar"></use></svg>
              <span>Kalender</span>
            </button>
            <button class="tab-add" type="button" aria-label="Hinzufügen">
              <svg class="icon"><use href="#icon-plus"></use></svg>
            </button>
            <button class="tab-btn" type="button" data-tab="media">
              <svg class="icon"><use href="#icon-photos"></use></svg>
              <span>Medien</span>
            </button>
            <button class="tab-btn" type="button" data-tab="settings">
              <svg class="icon"><use href="#icon-settings"></use></svg>
              <span>Einstellungen</span>
            </button>
          </nav>

          <!-- composer: ersetzt die Navigation im selben Container beim Anlegen -->
          <div class="composer" id="composer" hidden>
            <button class="composer-link" type="button" id="composer-link">
              <svg class="icon"><use href="#icon-link"></use></svg>
              <span id="composer-link-label">Inbox</span>
              <svg class="icon composer-caret"><use href="#icon-chevron"></use></svg>
            </button>
            <input
              class="composer-input"
              id="composer-input"
              type="text"
              placeholder="Notiz, Aufgabe, Termin …"
              aria-label="Neuer Eintrag"
              autocomplete="off"
            />
            <div class="composer-tools">
              <div class="composer-types" id="composer-types"></div>
              <button class="composer-close" type="button" id="composer-close" aria-label="Schließen">
                <svg class="icon"><use href="#icon-close"></use></svg>
              </button>
            </div>
          </div>
          </div>
        </footer>

        <!-- Kleines Menü beim gedrückt Halten von Tabs und Arbeitsbereichen -->
        <div class="ctx-backdrop" id="ctx-menu" hidden>
          <div class="ctx-card" id="ctx-card"></div>
        </div>

        <!-- sheet: gemeinsames Auswahl-Blatt fuer Verknuepfen und Seitenmenue -->
        <div class="sheet-backdrop" id="sheet" hidden>
          <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <h2 class="sheet-title" id="sheet-title"></h2>
            <div class="sheet-options" id="sheet-options"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
