<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Paralist">
  <title>Paralist</title>
  <!--
    App-Icon: die vier Übersichts-Kacheln der App (Eingang, Favoriten, Projekte, Ressourcen).
    Pfade sind 1:1 die Symbole aus index.html, Farben die Hellmodus-Werte aus styles.css:
    var inbox-icon-color, var star-color, var project-icon-color, var resource-icon-color.
    Eine eigenstaendige SVG-Datei kann styles.css nicht lesen, darum stehen die Werte hier fest:
    aendern sich die Variablen, muessen sie hier nachgezogen werden.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4" />
      <stop offset="1" stop-color="#e7e7e7" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#plate)" />

  <!-- Eingang, oben links -> var inbox-icon-color -->
  <g transform="translate(222 222) scale(10.833)" fill="none" stroke="#233d4c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.4v8.6M8.7 8.6 12 12l3.3-3.4" />
    <path d="M4 13.6h4.1l1.2 1.9h5.4l1.2-1.9H20v4.3A2.2 2.2 0 0 1 17.8 20.1H6.2A2.2 2.2 0 0 1 4 17.9v-4.3Z" />
  </g>

  <!-- Favoriten, oben rechts -> var star-color -->
  <g transform="translate(542 222) scale(10.833)" fill="none" stroke="#f5c518" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
  </g>

  <!-- Projekte, unten links -> var project-icon-color -->
  <g transform="translate(222 542) scale(10.833)" fill="none" stroke="#5B0E14" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
  </g>

  <!-- Ressourcen, unten rechts -> var resource-icon-color -->
  <g transform="translate(542 542) scale(10.833)" fill="none" stroke="#1A2517" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m21 7.5-2.25-1.313M21 7.5v2.25m0-2.25-2.25 1.313M3 7.5l2.25-1.313M3 7.5l2.25 1.313M3 7.5v2.25m9 3 2.25-1.313M12 12.75l-2.25-1.313M12 12.75V15m0 6.75 2.25-1.313M12 21.75V19.5m0 2.25-2.25-1.313m0-16.875L12 2.25l2.25 1.313M21 14.25v2.25l-2.25 1.313m-13.5 0L3 16.5v-2.25" />
  </g>
</svg>
