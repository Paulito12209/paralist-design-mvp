    <path d="M12 16v4M8 20h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  </symbol>
  <symbol id="icon-sun" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.6" />
