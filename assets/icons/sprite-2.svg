  </symbol>
  <!-- svg/symbol: zwei versetzte Blätter — Knopf „Seite kopieren“ auf der Eintragsseite -->
  <symbol id="icon-copy" viewBox="0 0 24 24" fill="none">
    <rect x="8" y="8" width="13" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M4.5 16A1.8 1.8 0 0 1 3 14.2V5a2 2 0 0 1 2-2h9.2A1.8 1.8 0 0 1 16 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
