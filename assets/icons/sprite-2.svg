<!-- Icon-Sammlung der App, Teil 2: Darstellung, Profil, Medien, Zeichnung
     und Aufgaben-Board. Fortsetzung von assets/icons/sprite.svg — dort steht
     die Erklärung, hier nur weitere <symbol>-Icons desselben Namensraums. -->
<svg class="sprites" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
