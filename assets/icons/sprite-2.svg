    <circle cx="12" cy="12" r="1.7" fill="currentColor" />
    <circle cx="12" cy="18.8" r="1.7" fill="currentColor" />
  </symbol>
  <!-- Kalender: Listen-Icon (wechselt zur Liste) und Raster-Icon (wechselt zum Stundenraster) -->
  <symbol id="icon-list" viewBox="0 0 24 24" fill="none">
